name: ポケカ先着枠の空き監視

on:
  schedule:
    # 5分おき（GitHub の混雑時は 5〜15 分ほど遅れることがあります）
    - cron: "*/5 * * * *"
  workflow_dispatch:        # 手動実行もできるようにする

permissions:
  contents: write           # state.json を書き戻すために必要

concurrency:
  group: pokeca-watch       # 前の実行と重ならないようにする
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存パッケージを入れる
        run: pip install -r requirements.txt

      - name: 空きをチェックする
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python watch.py --once

      - name: 状態を保存する
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "状態を更新 [skip ci]"
            # 別の実行が先に push している場合に備えて取り込んでから送る
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "変化なし（コミットするものはありません）"
          fi
